name: Publish Google Play

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-play-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build AAB and submit production release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

      - name: Configure Google Play credentials
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          test -n "$GOOGLE_PLAY_JSON_KEY"
          install -d -m 700 "$HOME/.config"
          printf '%s' "$GOOGLE_PLAY_JSON_KEY" > "$HOME/.config/googlePlay.json"
          chmod 600 "$HOME/.config/googlePlay.json"
          echo "GOOGLE_PLAY_JSON_KEY_PATH=$HOME/.config/googlePlay.json" >> "$GITHUB_ENV"

      - name: Build signed Play AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew -PplayStore=true bundleRelease --stacktrace

      - name: Install Google API dependencies
        run: python3 -m pip install --disable-pip-version-check google-auth requests

      - name: Submit production release
        run: |
          python3 scripts/publish_google_play.py \
            --aab app/build/outputs/bundle/release/app-release.aab \
            --track production \
            --status completed
