name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.sha }}
          path: app/build/reports/tests/
          retention-days: 7

  instrumented-e2e:
    name: E2E & Screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented E2E tests and capture screenshots
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none
          script: |
            set -o pipefail
            ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
            DEVICE_ABI=$(adb shell getprop ro.product.cpu.abi)
            APP_APK="app/build/outputs/apk/debug/app-${DEVICE_ABI}-debug.apk"
            TEST_APK="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
            adb install -t -r "$APP_APK"
            adb install -t -r "$TEST_APK"
            adb shell pm grant com.beatbridge android.permission.BLUETOOTH_CONNECT
            adb shell pm grant com.beatbridge android.permission.POST_NOTIFICATIONS
            mkdir -p artifacts/e2e artifacts/screenshots
            adb shell am instrument -w \
              com.beatbridge.test/androidx.test.runner.AndroidJUnitRunner \
              | tee artifacts/e2e/instrumentation.log
            adb pull /sdcard/Android/data/com.beatbridge/files/screenshots/. artifacts/screenshots/
            test -s artifacts/screenshots/01_empty_state.png
            test -s artifacts/screenshots/02_devices_found.png
            test -s artifacts/screenshots/03_device_selected.png
            test -s artifacts/screenshots/04_full_list.png

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-${{ github.sha }}
          path: artifacts/e2e/
          if-no-files-found: error
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ github.sha }}
          path: artifacts/screenshots/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-and-test, instrumented-e2e]
    if: github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Compute version
        id: version
        run: |
          BASE=$(grep '^versionBase=' version.properties | cut -d= -f2 | tr -d '\r')
          PATCH=${{ github.run_number }}
          VERSION="${BASE}.${PATCH}"
          echo "versionBase=${BASE}" > version.properties
          echo "versionName=${VERSION}" >> version.properties
          echo "versionCode=${PATCH}" >> version.properties
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          TIMESTAMP=$(date +%s)
          ASSET_DIR="app/src/main/assets/changelogs"
          mkdir -p "$ASSET_DIR"

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="${LAST_TAG:+$LAST_TAG..HEAD}"

          git --no-pager log --pretty=format:'%s' ${RANGE:-HEAD} | \
            sort -u | \
            grep -v "^Merge " | \
            grep -v "^Bump " | \
            grep -v "\[skip-ci\]" | \
            grep -v "^ci:" | \
            grep -v "^chore:" | \
            grep -v "^test:" | \
            grep -v "^refactor:" | \
            grep -v "^style:" | \
            grep -v "^docs:" | \
            grep -v "^build:" | \
            grep -v "^Fix lint" | \
            grep -v "^Fix tests" | \
            grep -v "^Fix formatting" | \
            grep -v "^Fix ordering" | \
            grep -v "^Fix git " | \
            grep -v "^Fix ci" | \
            grep -v "^Add CLAUDE" | \
            grep -v "^Add FUNDING" | \
            grep -v "^Update screenshots" | \
            grep -v "^Clean up " | \
            grep -v "^Revert " | \
            head -10 | \
            sed 's/^feat: //' | \
            sed 's/^fix: /Fix /' | \
            sed 's/^perf: //' | \
            sed 's/^/• /' > "$ASSET_DIR/$TIMESTAMP.txt"

          if [ ! -s "$ASSET_DIR/$TIMESTAMP.txt" ]; then
            echo "• Bug fixes and improvements" > "$ASSET_DIR/$TIMESTAMP.txt"
          fi

          # Deduplicate: skip if first line already exists in another file
          FIRST=$(head -1 "$ASSET_DIR/$TIMESTAMP.txt" | sed 's/[.[\*^$()+?{|]/\\&/g')
          DUP=$(grep -rl "^${FIRST}$" "$ASSET_DIR/" 2>/dev/null | grep -v "$TIMESTAMP.txt" | head -1)
          if [ -n "$DUP" ]; then
            echo "Skipping duplicate changelog (matches $DUP)"
            rm "$ASSET_DIR/$TIMESTAMP.txt"
          fi

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      - name: Update changelog
        run: |
          VERSION=$(grep ^versionName version.properties | cut -d '=' -f2 | tr -d '\r')
          DATE=$(date +%Y-%m-%d)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"- %s" | grep -v '\[skip-ci\]' || true)
          if [ -n "$COMMITS" ]; then
            NEW_SECTION="## [${VERSION}] - ${DATE}\n\n### Changed\n${COMMITS}\n"
            awk -v new="$NEW_SECTION" '/^## \[/{if(!done){print new; done=1}} {print}' CHANGELOG.md > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
          fi

      - name: Download verified E2E screenshots
        uses: actions/download-artifact@v4
        with:
          name: e2e-screenshots-${{ github.sha }}
          path: fastlane/metadata/android/en-US/images/phoneScreenshots

      - name: Commit and push new version
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          VERSION=$(grep ^versionName version.properties | cut -d '=' -f2 | tr -d '\r')
          git add version.properties CHANGELOG.md app/src/main/assets/changelogs/ fastlane/metadata/android/en-US/images/phoneScreenshots/
          git commit -m "Bump to $VERSION [skip-ci]"
          git tag ${{ steps.version.outputs.tag }}
          git push origin master
          git push origin ${{ steps.version.outputs.tag }}

      - name: Build release APKs
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename APKs with version
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          OUTDIR="app/build/outputs/apk/release"
          for APK in "$OUTDIR"/app-*-release.apk; do
            ABI=$(basename "$APK" | sed 's/app-\(.*\)-release\.apk/\1/')
            cp "$APK" "$OUTDIR/BeatBridge-${TAG}-${ABI}.apk"
          done

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: app/build/outputs/apk/release/BeatBridge-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BeatBridge ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/BeatBridge-*.apk
          body: |
            ## BeatBridge ${{ steps.version.outputs.tag }}

            Auto-play music when your Bluetooth device connects.

            ### Install options

            | Method | Notes |
            |--------|-------|
            | **F-Droid** | Verified build from source, signed by F-Droid *(recommended)* |
            | **APK below** | Signed — built directly from this commit |
            | **Build yourself** | `git clone`, checkout this tag, `./gradlew assembleRelease` |

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/CHANGELOG.md) for what's new.

  virustotal:
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: release-apks

      - name: VirusTotal Scan
        id: vt
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            release-apks/BeatBridge-${{ needs.release.outputs.tag }}-arm64-v8a.apk
            release-apks/BeatBridge-${{ needs.release.outputs.tag }}-armeabi-v7a.apk
            release-apks/BeatBridge-${{ needs.release.outputs.tag }}-x86_64.apk
            release-apks/BeatBridge-${{ needs.release.outputs.tag }}-x86.apk

      - name: Append VirusTotal links to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.tag }}
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          VT_SECTION=$'\n\n<details>\n<summary>VirusTotal Analysis</summary>\n\n'
          IFS=',' read -ra ENTRIES <<< "$ANALYSIS"
          for entry in "${ENTRIES[@]}"; do
            filename=$(basename "${entry%%=*}")
            url="${entry#*=}"
            VT_SECTION+="- [${filename}](${url})"$'\n'
          done
          VT_SECTION+=$'\n</details>'
          CURRENT_BODY=$(gh release view "$VERSION" --json body -q .body)
          gh release edit "$VERSION" --notes "${CURRENT_BODY}${VT_SECTION}"
